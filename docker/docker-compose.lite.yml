services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - "9000:9000"
    environment:
      - SCANNER_SAST_HOST=sast
      - SCANNER_SAST_PORT=9001
    depends_on:
      - sast

  sast:
    build:
      context: ../packages/scanners/sast
    ports:
      - "9001:9001"
