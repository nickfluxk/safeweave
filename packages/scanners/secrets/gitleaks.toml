# SafeWeave secrets-scanner config.
# Extends gitleaks' default ruleset and adds a narrow allowlist so intentional
# example / placeholder secrets (documentation, teaching content, test fixtures)
# don't surface as critical findings. Real secrets elsewhere are still detected.
title = "SafeWeave gitleaks config"

[extend]
useDefault = true

# gitleaks 8.19+ uses the [[allowlists]] array-of-tables form.
[[allowlists]]
description = "Documented example/placeholder secrets — not live credentials"
regexTarget = "match"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',                                   # AWS's own documented example key
  '''(?i)(example|placeholder|your[_-][a-z]|changeme|dummy|sample|redacted|xxxx+|<[a-z_]+>)''',
]

[[allowlists]]
description = "Files whose purpose is to display example secrets (teaching content)"
paths = [
  '''secrets-detection-guide\.(md|html|rsc|txt)$''',
]
